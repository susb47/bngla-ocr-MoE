[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moedocs"
version = "0.1.0"
description = "Bangla Document Pipeline – OCR/scrape → Markdown → review → training material"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "moe-docs team" }]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiofiles>=24.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
ocr = [
    "pytesseract>=0.3.10",
]
# LibreOffice is a system dependency for normalize (not a Python package)

[project.scripts]
moedocs = "moedocs.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/moedocs"]

[tool.hatch.build.targets.sdist]
include = ["src/moedocs", "docs", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
